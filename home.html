<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Durjoy TV — Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Thasadith:ital,wght@0,400;0,700;1,400;1,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Thasadith', 'Hind Siliguri', sans-serif;
      color: #fff;
    }

    /* ════════ BACKGROUND VIDEO ════════ */
    #videoWrapper { position: fixed; inset: 0; z-index: 0; }
    #videoPlayer { width: 100%; height: 100%; object-fit: cover; }
    #videoDim {
      position: fixed; inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.15) 22%,
        rgba(0,0,0,0.15) 50%,
        rgba(0,0,0,0.65) 78%,
        rgba(0,0,0,0.9) 100%
      );
      z-index: 1;
      pointer-events: none;
    }

    #app { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; }

    /* ════════ TOP BAR ════════ */
    #topBar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 36px 0 30px;
    }
    #brand { display: flex; align-items: center; gap: 12px; }
    #brand svg { width: 34px; height: 34px; flex-shrink: 0; }
    #brand span {
      font-size: 22px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
    }
    #liveBadge {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      padding: 7px 16px; border-radius: 22px;
      font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
    }
    #liveBadge .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ff7f2a;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }

    /* ════════ SPACER (lets video breathe) ════════ */
    #spacer { flex: 1; }

    /* ════════ NOW PLAYING ════════ */
    #nowPlaying {
      padding: 0 36px 18px 36px;
      display: flex; align-items: center; gap: 14px;
    }
    #nowPlayingBar { width: 4px; height: 50px; background: #ff7f2a; border-radius: 2px; flex-shrink: 0; }
    #nowPlayingText .label {
      font-size: 14px; font-weight: 400; color: rgba(255,255,255,0.65);
    }
    #nowPlayingText .channel {
      font-size: 34px; font-weight: 600; line-height: 1.15;
    }

    /* ════════ CHANNEL RAIL ════════ */
    #channelRailWrap { padding: 0 0 18px 0; }
    #channelRail {
      display: flex; gap: 12px;
      overflow-x: auto;
      padding: 4px 36px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }
    #channelRail::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0;
      padding: 12px 22px;
      border-radius: 24px;
      border: 1.5px solid rgba(255,255,255,0.35);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(6px);
      font-size: 16px; font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .chip.active, .chip:focus, .chip.focused {
      background: #ff7f2a;
      border-color: #ff7f2a;
      color: #1a1a1a;
      font-weight: 700;
      outline: none;
      transform: scale(1.06);
    }

    /* ════════ CATEGORY GRID ════════ */
    #categoryGrid {
      display: flex; gap: 14px;
      padding: 0 36px 24px 36px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #categoryGrid::-webkit-scrollbar { display: none; }
    .catCard {
      flex: 1;
      min-width: 130px;
      padding: 24px 10px;
      border-radius: 14px;
      background: linear-gradient(135deg, #8fd3a8 0%, #6fa8e0 100%);
      color: #16321f;
      font-size: 20px; font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      border: 2px solid transparent;
    }
    .catCard:focus, .catCard.focused {
      outline: none;
      transform: translateY(-4px) scale(1.03);
      border-color: #fff;
      box-shadow: 0 10px 24px rgba(0,0,0,0.4);
    }
    .catCard:nth-child(1) { background: linear-gradient(135deg, #ffd194 0%, #d1913c 100%); }
    .catCard:nth-child(2) { background: linear-gradient(135deg, #8fd3a8 0%, #6fa8e0 100%); }
    .catCard:nth-child(3) { background: linear-gradient(135deg, #a1ffce 0%, #faffd1 100%); }
    .catCard:nth-child(4) { background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%); }
    .catCard:nth-child(5) { background: linear-gradient(135deg, #fddb92 0%, #d1fdff 100%); }

    /* ════════ BOTTOM ICON NAV ════════ */
    #bottomNav {
      display: flex; align-items: center; justify-content: center; gap: 28px;
      padding: 4px 0 26px 0;
    }
    .navIcon {
      width: 58px; height: 58px;
      border-radius: 50%;
      background: rgba(255,255,255,0.95);
      color: #1a1a1a;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
      border: 2px solid transparent;
    }
    .navIcon svg { width: 26px; height: 26px; }
    .navIcon:focus, .navIcon.focused {
      outline: none;
      background: #ff7f2a;
      color: #fff;
      transform: scale(1.12);
      border-color: #fff;
    }

    /* ════════ CATEGORY OVERLAY ════════ */
    #categoryOverlay {
      position: fixed; inset: 0;
      background: rgba(10,10,10,0.92);
      backdrop-filter: blur(10px);
      z-index: 50;
      display: none;
      flex-direction: column;
      padding: 30px 36px;
    }
    #categoryOverlay.show { display: flex; }
    #catOverlayHeader {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 22px;
    }
    #catOverlayTitle { font-size: 26px; font-weight: 700; }
    #catCloseBtn {
      width: 44px; height: 44px; border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 20px;
      border: 2px solid transparent;
    }
    #catCloseBtn:focus, #catCloseBtn.focused {
      outline: none; background: #ff7f2a; border-color: #fff;
    }
    #catChannelGrid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      overflow-y: auto;
      align-content: start;
      padding-bottom: 20px;
    }
    .catChannelItem {
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 18px 16px;
      font-size: 17px; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex; align-items: center; gap: 10px;
    }
    .catChannelItem .num {
      font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 600;
      min-width: 26px;
    }
    .catChannelItem:focus, .catChannelItem.focused {
      outline: none;
      background: #ff7f2a;
      border-color: #ff7f2a;
      color: #1a1a1a;
      transform: scale(1.03);
    }
    .catChannelItem:focus .num, .catChannelItem.focused .num { color: rgba(0,0,0,0.5); }

    #emptyCatMsg {
      color: rgba(255,255,255,0.4);
      font-size: 16px;
      padding: 30px;
      text-align: center;
    }

    /* ════════ TOAST ════════ */
    #toast {
      position: fixed; bottom: 110px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(20,20,20,0.92);
      border-radius: 6px;
      padding: 9px 20px;
      font-size: 12px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
      color: rgba(255,255,255,0.85);
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 80;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ════════ LOADING ════════ */
    #initLoader {
      position: fixed; inset: 0; background:#000; z-index: 100;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
    }
    #initLoader.hidden { display: none; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.15);
      border-top-color: #ff7f2a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #initLoaderText { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.5); }

    /* responsive: smaller phones */
    @media (max-width: 480px) {
      #nowPlayingText .channel { font-size: 24px; }
      #brand span { font-size: 16px; }
      .catCard { font-size: 15px; padding: 18px 8px; min-width: 100px; }
      #topBar { padding: 16px 18px 0 18px; }
      #nowPlaying, #categoryGrid { padding-left: 18px; padding-right: 18px; }
      #channelRail { padding: 4px 18px; }
      .navIcon { width: 50px; height: 50px; }
    }
  </style>
</head>
<body>

<div id="initLoader">
  <div class="spinner"></div>
  <div id="initLoaderText">Loading channels...</div>
</div>

<div id="videoWrapper">
  <video id="videoPlayer" autoplay playsinline
    poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
</div>
<div id="videoDim"></div>

<div id="app">
  <!-- TOP BAR -->
  <div id="topBar">
    <div id="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 8l-3-5M17 8l3-5"/>
        <rect x="2" y="8" width="20" height="13" rx="2"/>
        <circle cx="7" cy="14.5" r="1.2" fill="currentColor" stroke="none"/>
      </svg>
      <span>Live Channels</span>
    </div>
    <div id="liveBadge"><span class="dot"></span> <span id="clockText">--:--</span></div>
  </div>

  <div id="spacer"></div>

  <!-- NOW PLAYING -->
  <div id="nowPlaying">
    <div id="nowPlayingBar"></div>
    <div id="nowPlayingText">
      <div class="label">Now Playing</div>
      <div class="channel" id="nowPlayingName">—</div>
    </div>
  </div>

  <!-- CHANNEL RAIL -->
  <div id="channelRailWrap">
    <div id="channelRail"></div>
  </div>

  <!-- CATEGORY GRID -->
  <div id="categoryGrid"></div>

  <!-- BOTTOM NAV -->
  <div id="bottomNav">
    <div class="navIcon" id="btnSettings" tabindex="0" data-nav="settings.html" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009.5 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9.5a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
      </svg>
    </div>
    <div class="navIcon" id="btnPlay" tabindex="0" data-nav="index.html" title="Watch">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 8l-3-5M17 8l3-5"/>
        <rect x="2" y="8" width="20" height="13" rx="2"/>
        <path d="M9.5 12.5l3 1.7-3 1.7z" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div class="navIcon" id="btnSource" tabindex="0" title="Source">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <path d="M21 21l-4.3-4.3"/>
        <path d="M9 9l4 4M13 9l-4 4"/>
      </svg>
    </div>
  </div>
</div>

<!-- CATEGORY OVERLAY -->
<div id="categoryOverlay">
  <div id="catOverlayHeader">
    <div id="catOverlayTitle">Category</div>
    <div id="catCloseBtn" tabindex="0">✕</div>
  </div>
  <div id="catChannelGrid"></div>
</div>

<div id="toast"></div>

<script src="player-core.js"></script>
<script>
/* ===================================================
   HOME.HTML
   - Full-bleed unmuted background of current channel
   - Channel rail (scrollable, remote+touch navigable)
   - Category cards → overlay with channel grid
   - Bottom nav: Settings / Watch (index.html) / Source
   - Source icon opens a prompt-based quick source override
=================================================== */

let channels = [];
let currentIndex = 0;
let bgHls = null;

const video = document.getElementById('videoPlayer');
const initLoader = document.getElementById('initLoader');
const initLoaderText = document.getElementById('initLoaderText');
const nowPlayingName = document.getElementById('nowPlayingName');
const channelRail = document.getElementById('channelRail');
const categoryGrid = document.getElementById('categoryGrid');
const categoryOverlay = document.getElementById('categoryOverlay');
const catOverlayTitle = document.getElementById('catOverlayTitle');
const catChannelGrid = document.getElementById('catChannelGrid');
const catCloseBtn = document.getElementById('catCloseBtn');
const toastEl = document.getElementById('toast');

let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ── BACKGROUND PLAYBACK (unmuted, no OSD, just ambience) ── */
function tryPlay() {
  const p = video.play();
  if (p && p.catch) {
    p.catch(() => {
      // Unmuted autoplay was blocked by the platform — fall back to muted
      // so playback at least starts; this should rarely trigger inside
      // the WebView app since setMediaPlaybackRequiresUserGesture(false)
      // is set natively, but it's a safe guard for other environments.
      video.muted = true;
      video.play().catch(() => {});
    });
  }
}

function playBackground(idx) {
  const ch = channels[idx];
  if (!ch) return;
  nowPlayingName.textContent = ch.name;

  const srcIdx = DurjoyCore.loadLastSource(idx);
  const src = ch.sources[srcIdx] || ch.sources[0];
  if (!src) return;

  if (bgHls) { bgHls.destroy(); bgHls = null; }
  video.muted = false;

  if (window.Hls && Hls.isSupported()) {
    bgHls = new Hls({ maxBufferLength: 30 });
    bgHls.loadSource(src.url);
    bgHls.attachMedia(video);
    bgHls.on(Hls.Events.MANIFEST_PARSED, () => tryPlay());
    bgHls.on(Hls.Events.ERROR, (e, data) => {
      if (data.fatal) {
        // silently try next source for background, no harsh UI
        const sIdx = ch.sources.indexOf(src);
        if (sIdx + 1 < ch.sources.length) {
          setTimeout(() => playBackgroundWithSource(idx, sIdx + 1), 600);
        }
      }
    });
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src.url;
    tryPlay();
  }
}
function playBackgroundWithSource(idx, srcIdx) {
  const ch = channels[idx];
  const src = ch.sources[srcIdx];
  if (!src) return;
  if (bgHls) { bgHls.destroy(); bgHls = null; }
  video.muted = false;
  if (window.Hls && Hls.isSupported()) {
    bgHls = new Hls({ maxBufferLength: 30 });
    bgHls.loadSource(src.url);
    bgHls.attachMedia(video);
    bgHls.on(Hls.Events.MANIFEST_PARSED, () => tryPlay());
  }
}

/* ── CHANNEL RAIL ── */
function buildChannelRail() {
  channelRail.innerHTML = '';
  channels.forEach((ch, i) => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = ch.name;
    chip.tabIndex = 0;
    chip.dataset.index = i;
    if (i === currentIndex) chip.classList.add('active');
    chip.addEventListener('click', () => selectChannel(i));
    chip.addEventListener('keydown', e => {
      if (e.key === 'Enter') selectChannel(i);
    });
    channelRail.appendChild(chip);
  });
}

function selectChannel(i) {
  currentIndex = i;
  DurjoyCore.saveLastChannel(i);
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  const chip = channelRail.querySelector(`[data-index="${i}"]`);
  if (chip) {
    chip.classList.add('active');
    chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
  playBackground(i);
}

/* ── CATEGORY GRID ── */
function buildCategoryGrid() {
  categoryGrid.innerHTML = '';
  const cats = DurjoyCore.getCategories();
  cats.forEach(cat => {
    const card = document.createElement('div');
    card.className = 'catCard';
    card.textContent = cat;
    card.tabIndex = 0;
    card.addEventListener('click', () => openCategory(cat));
    card.addEventListener('keydown', e => { if (e.key === 'Enter') openCategory(cat); });
    categoryGrid.appendChild(card);
  });
}

function openCategory(cat) {
  catOverlayTitle.textContent = cat;
  catChannelGrid.innerHTML = '';
  const list = DurjoyCore.getChannelsByCategory(cat);
  if (list.length === 0) {
    catChannelGrid.innerHTML = '<div id="emptyCatMsg">No channels in this category</div>';
  } else {
    list.forEach(ch => {
      const item = document.createElement('div');
      item.className = 'catChannelItem';
      item.tabIndex = 0;
      item.innerHTML = `<span class="num">${String(ch.index + 1).padStart(2,'0')}</span><span>${ch.name}</span>`;
      item.addEventListener('click', () => {
        selectChannel(ch.index);
        closeCategory();
      });
      item.addEventListener('keydown', e => {
        if (e.key === 'Enter') { selectChannel(ch.index); closeCategory(); }
      });
      catChannelGrid.appendChild(item);
    });
  }
  categoryOverlay.classList.add('show');
  setTimeout(() => {
    const first = catChannelGrid.querySelector('.catChannelItem, #emptyCatMsg');
    if (first && first.focus) first.focus();
  }, 50);
}
function closeCategory() {
  categoryOverlay.classList.remove('show');
}
catCloseBtn.addEventListener('click', closeCategory);
catCloseBtn.addEventListener('keydown', e => { if (e.key === 'Enter') closeCategory(); });

/* ── BOTTOM NAV ── */
document.querySelectorAll('.navIcon[data-nav]').forEach(btn => {
  btn.addEventListener('click', () => window.location.href = btn.dataset.nav);
  btn.addEventListener('keydown', e => { if (e.key === 'Enter') window.location.href = btn.dataset.nav; });
});

const btnSource = document.getElementById('btnSource');
function openSourceDialog() {
  const current = DurjoyCore.getSourceUrl();
  const next = prompt('Channel list JSON URL:', current);
  if (next && next.trim() && next.trim() !== current) {
    DurjoyCore.setSourceUrl(next.trim());
    showToast('Source updated — reloading...');
    setTimeout(() => location.reload(), 900);
  }
}
btnSource.addEventListener('click', openSourceDialog);
btnSource.addEventListener('keydown', e => { if (e.key === 'Enter') openSourceDialog(); });

/* ── REMOTE / KEYBOARD NAVIGATION (not channel switching — UI navigation) ── */
const focusableSelector = '.chip, .catCard, .navIcon, .catChannelItem, #catCloseBtn';

function getFocusableInZone() {
  if (categoryOverlay.classList.contains('show')) {
    return Array.from(document.querySelectorAll('#categoryOverlay [tabindex]'));
  }
  return Array.from(document.querySelectorAll('#channelRail .chip, #categoryGrid .catCard, #bottomNav .navIcon'));
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack' || e.key === 'BrowserBack') {
    if (categoryOverlay.classList.contains('show')) {
      e.preventDefault();
      closeCategory();
    }
    return;
  }

  // Let Enter activate naturally via element's own keydown listener / click
  if (e.key === 'Enter') return;

  const navKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
  if (!navKeys.includes(e.key)) return;

  e.preventDefault();
  const active = document.activeElement;
  const list = getFocusableInZone();
  if (list.length === 0) return;

  let idx = list.indexOf(active);
  if (idx === -1) { list[0].focus(); return; }

  // Determine rows roughly by grouping via parent container for up/down,
  // and simple prev/next within same container for left/right.
  const sameParentList = list.filter(el => el.parentElement === active.parentElement);
  const posInRow = sameParentList.indexOf(active);

  if (e.key === 'ArrowRight') {
    const next = sameParentList[posInRow + 1];
    if (next) next.focus();
  } else if (e.key === 'ArrowLeft') {
    const prev = sameParentList[posInRow - 1];
    if (prev) prev.focus();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    // Move between zones: rail -> categoryGrid -> bottomNav (down), reverse (up)
    if (categoryOverlay.classList.contains('show')) {
      // simple grid wrap within overlay using column count estimate
      const cols = Math.max(1, Math.floor(catChannelGrid.clientWidth / 230));
      const overlayList = Array.from(document.querySelectorAll('#categoryOverlay [tabindex]'));
      const i = overlayList.indexOf(active);
      const target = e.key === 'ArrowDown' ? i + cols : i - cols;
      if (overlayList[target]) overlayList[target].focus();
      return;
    }
    const zones = [
      Array.from(channelRail.querySelectorAll('.chip')),
      Array.from(categoryGrid.querySelectorAll('.catCard')),
      Array.from(document.querySelectorAll('#bottomNav .navIcon'))
    ];
    const zoneIdx = zones.findIndex(z => z.includes(active));
    if (zoneIdx === -1) { zones[0][0] && zones[0][0].focus(); return; }
    const targetZone = e.key === 'ArrowDown' ? zoneIdx + 1 : zoneIdx - 1;
    if (zones[targetZone] && zones[targetZone].length) {
      zones[targetZone][0].focus();
    }
  }
});

/* ── CLOCK ── */
function tickClock() {
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes().toString().padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = (h % 12) || 12;
  document.getElementById('clockText').textContent = `${h}:${m} ${ampm}`;
}
tickClock();
setInterval(tickClock, 15000);

/* ═══════════════════════════════════════
   START
═══════════════════════════════════════ */
(async function start() {
  const result = await DurjoyCore.fetchChannels();
  channels = DurjoyCore.getChannels();

  if (channels.length === 0) {
    initLoaderText.textContent = 'No channels found. Open Source to set a JSON link.';
    return;
  }
  if (!result.ok && result.usedCache) {
    showToast('Using cached list — source unreachable');
  }

  initLoader.classList.add('hidden');

  currentIndex = DurjoyCore.loadLastChannel();
  buildChannelRail();
  buildCategoryGrid();
  playBackground(currentIndex);

  setTimeout(() => {
  const activeChip = channelRail.querySelector(`[data-index="${currentIndex}"]`);
  if (activeChip) {
    activeChip.classList.add('active');
    activeChip.focus();
    activeChip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }
}, 300);
})();
</script>
